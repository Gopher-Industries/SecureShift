services:
  backend:
    build:
      context: ./app-backend
    volumes: 
      - ./app-backend:/app
    container_name: secureshift-backend
    ports:
      - "${BACKEND_HOST_PORT:-5000}:5000"
    environment:
      NODE_ENV: development
      PORT: "5000"
      OLLAMA_HOST: http://ollama:11434
      MONGO_URI: mongodb://secureshift_app:secureshift_app_password@mongodb:27017/secureshift_local?authSource=secureshift_local
      JWT_SECRET: local-dev-jwt-secret-change-me
      LICENCE_ENC_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      AUDIT_LOG_ENABLED: "true"
      EMAIL_ENABLED: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_AUTH_REQUIRED: "false"
      SMTP_FROM_EMAIL: local@example.test
      VERIFICATION_ENABLED: "false"
    depends_on:
      mongodb:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # Keep uploaded licence and incident files across container rebuilds.
      # Without this the container filesystem is discarded and every upload is lost.
      - uploads-data:/app/uploads
    networks:
      - secureshift
    command: npm start
  ollama:
    image: ollama/ollama:latest
    container_name: secureshift-ollama
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - secureshift

  ollama-models:
    image: ollama/ollama:latest
    container_name: secureshift-ollama-models

    depends_on:
      - ollama

    environment:
      OLLAMA_HOST: http://ollama:11434

    entrypoint: ["/bin/sh", "-c"]

    command: |
      echo "Waiting for Ollama..."

      until ollama list >/dev/null 2>&1; do
        sleep 2
      done

      echo "Pulling llama3.2..."
      ollama pull llama3.2

      echo "Pulling nomic-embed-text..."
      ollama pull nomic-embed-text:latest

      echo "Models ready."

    restart: "no"

    networks:
      - secureshift

  ai-indexer:
    build:
      context: ./app-backend
    container_name: secureshift-ai-indexer
    volumes:
      - ./app-backend:/app
    environment:
      NODE_ENV: development
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama-models:
        condition: service_completed_successfully
    command: node src/ai/indexing/buildIndex.js
    restart: "no"
    networks:
      - secureshift
  mailpit:
    image: axllent/mailpit:v1.29.7
    container_name: secureshift-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - secureshift

  mongodb:
    image: mongo:6
    container_name: secureshift-db
    ports:
      - "${MONGODB_HOST_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: secureshift_root
      MONGO_INITDB_ROOT_PASSWORD: secureshift_root_password
      MONGO_INITDB_DATABASE: secureshift_local
    volumes:
      - mongo-data:/data/db
      - ./app-backend/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 })' >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - secureshift

  frontend-employer:
    build:
      context: ./app-frontend/employer-panel
    container_name: secureshift-frontend-employer
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      REACT_APP_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-5000}/api/v1
    restart: unless-stopped
    networks:
      - secureshift
    command: npm start

  frontend-admin:
    build:
      context: ./app-frontend/admin-panel
    container_name: secureshift-frontend-admin
    ports:
      - "${ADMIN_FRONTEND_HOST_PORT:-3001}:3001"
    environment:
      REACT_APP_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-5000}/api/v1
    restart: unless-stopped
    networks:
      - secureshift
    command: npm start
    
volumes:
  mongo-data:

  ollama-data:



networks:
  secureshift:
